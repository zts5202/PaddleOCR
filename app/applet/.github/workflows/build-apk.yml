name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Self-Heal Keystore & Environment
        run: |
          # Ensure .env file exists
          touch .env

          # Ensure debug.keystore is present
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Grant execution permissions for gradlew
          chmod +x gradlew

      - name: Extract Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2 || echo "1.0.0")
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | awk '{print $3}' || echo "1")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building APK version: $VERSION_NAME (Code: $VERSION_CODE)"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Root Artifact
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APP_NAME="PaddleOCR"
          TARGET_APK="${APP_NAME}-v${{ steps.get_version.outputs.VERSION_NAME }}.apk"
          cp "$APK_PATH" "$TARGET_APK"
          echo "TARGET_APK=$TARGET_APK" >> $GITHUB_ENV

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaddleOCR-v${{ steps.get_version.outputs.VERSION_NAME }}
          path: ${{ env.TARGET_APK }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION_NAME }}
          name: Release v${{ steps.get_version.outputs.VERSION_NAME }}
          body: |
            Automated direct-install APK release.
            Version: ${{ steps.get_version.outputs.VERSION_NAME }} (Code: ${{ steps.get_version.outputs.VERSION_CODE }})
          files: ${{ env.TARGET_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
